version: "3.8"

services:
  audit-mysql:
    image: mysql:8.0
    container_name: audit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-audit-pass
      MYSQL_DATABASE: audit_db
      MYSQL_USER: audit_user
      MYSQL_PASSWORD: audit_pass_2025
    ports:
      - "3307:3306"
    volumes:
      - audit_mysql_data:/var/lib/mysql
      - ./audit_db.sql:/docker-entrypoint-initdb.d/audit_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  audit-service:
    build: .
    container_name: audit-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      audit-mysql:
        condition: service_healthy
    environment:
      DB_HOST: audit-mysql
      DB_USER: audit_user
      DB_PASSWORD: audit_pass_2025
      DB_NAME: audit_db
      DB_PORT: 3306

volumes:
  audit_mysql_data:
