version: "3.8"

services:
  scheduler-mysql:
    image: mysql:8.0
    container_name: scheduler-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-scheduler-pass
      MYSQL_DATABASE: scheduler_db
      MYSQL_USER: scheduler_user
      MYSQL_PASSWORD: scheduler_pass_2025
    ports:
      - "3308:3306"
    volumes:
      - scheduler_mysql_data:/var/lib/mysql
      - ./scheduler_db.sql:/docker-entrypoint-initdb.d/scheduler_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  scheduler-service:
    build: .
    container_name: scheduler-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - .env
    depends_on:
      scheduler-mysql:
        condition: service_healthy
    environment:
      DB_HOST: scheduler-mysql
      DB_USER: scheduler_user
      DB_PASSWORD: scheduler_pass_2025
      DB_NAME: scheduler_db
      DB_PORT: 3306

volumes:
  scheduler_mysql_data:
